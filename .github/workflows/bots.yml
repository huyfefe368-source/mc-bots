name: Minecraft Bots

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run bots
        run: node bot.js
